<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlow</title>
    <link rel="icon" href="https://i.ibb.co/670939S4/Cine-Flow-icon.png" type="image/png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

        :root {
            --bg: #282a36;
            --bg-deep: #1e1f29;
            --panel: #2f3140;
            --panel-2: #363849;
            --line: #44475a;
            --fg: #f8f8f2;
            --dim: #a0a7c4;
            --comment: #6272a4;
            --cyan: #8be9fd;
            --green: #50fa7b;
            --orange: #ffb86c;
            --pink: #ff79c6;
            --purple: #bd93f9;
            --red: #ff5555;
            --yellow: #f1fa8c;
            --grad: linear-gradient(120deg, var(--purple) 0%, var(--pink) 100%);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 10% -10%, rgba(189, 147, 249, 0.16) 0%, transparent 45%),
                radial-gradient(circle at 100% 0%, rgba(255, 121, 198, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(139, 233, 253, 0.08) 0%, transparent 45%),
                var(--bg);
            color: var(--fg);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        code, .mono { font-family: 'JetBrains Mono', monospace; }

        /* ---------------- NAVBAR ---------------- */
        .navbar {
            width: 100%;
            position: fixed;
            top: 0; left: 0;
            z-index: 30;
            background: rgba(30, 31, 41, 0.75);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: all 0.3s ease;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.7rem 2.2rem;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            text-decoration: none;
        }

        .nav-logo {
            height: 40px;
            width: auto;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .nav-brand:hover .nav-logo { transform: scale(1.06); }

        .nav-links {
            display: flex;
            gap: 0.6rem;
        }

        .nav-link {
            color: var(--fg);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
            border-radius: 0.6rem;
            background: var(--panel);
            border: 1px solid var(--line);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .nav-link i { color: var(--purple); transition: color 0.2s ease; }

        .nav-link:hover {
            background: var(--grad);
            color: var(--bg-deep);
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(255, 121, 198, 0.28);
        }

        .nav-link:hover i { color: var(--bg-deep); }

        /* ---------------- HERO ---------------- */
        .main-hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 6rem 1.5rem 3rem;
        }

        .hero-content {
            width: 100%;
            max-width: 680px;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s forwards 0.3s;
        }

        .hero-logo {
            width: min(320px, 78vw);
            height: auto;
            max-height: 200px;
            object-fit: contain;
            border-radius: 1.1rem;
            margin-bottom: 1.8rem;
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 20px 50px rgba(189, 147, 249, 0.16);
            animation: bounce 2.4s ease-in-out infinite alternate;
        }

        .hero-content h1 {
            font-size: 2.6rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 1rem;
            animation: slideIn 1s ease-out;
        }

        .hero-highlight {
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero-sub {
            font-size: 1.05rem;
            color: var(--dim);
            margin-bottom: 2rem;
        }

        .hero-sub b { color: var(--fg); }

        .hero-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .btn-primary {
            background: var(--grad);
            color: var(--bg-deep);
            font-size: 0.9rem;
            padding: 0.75rem 1.5rem;
            border-radius: 0.7rem;
            box-shadow: 0 8px 20px rgba(255, 121, 198, 0.28);
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(255, 121, 198, 0.4); }

        .btn-secondary {
            background: var(--panel);
            color: var(--fg);
            border: 1px solid var(--line);
            font-size: 0.9rem;
            padding: 0.75rem 1.5rem;
            border-radius: 0.7rem;
        }

        .btn-secondary:hover { background: var(--panel-2); transform: translateY(-2px); }

        /* ---------------- FOOTER ---------------- */
        footer {
            padding: 0.9rem;
            text-align: center;
            border-top: 1px solid var(--line);
            color: var(--comment);
            font-size: 0.75rem;
        }

        footer a { color: var(--dim); margin: 0 0.4rem; text-decoration: none; }
        footer a:hover { color: var(--purple); }

        /* ---------------- KEYFRAMES ---------------- */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* ---------------- RESPONSIVE ---------------- */
        @media (max-width: 700px) {
            .nav-content { padding: 0.6rem 1rem; }
            .nav-link span { display: none; }
            .nav-link { padding: 0.55rem 0.7rem; }
            .hero-content h1 { font-size: 1.9rem; }
        }

        @media (max-width: 400px) {
            .nav-logo { height: 32px; }
            .hero-content h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
      <div class="nav-content">
        <a href="https://github.com/tharindu899" class="nav-brand">
          <img src="https://i.ibb.co/BHYKmvBH/Cine-Flow-barand.png" alt="CineFlow" class="nav-logo">
        </a>
        <div class="nav-links">
          <a href="https://t.me/CineFlow_Update" class="nav-link"><i class="fab fa-telegram-plane"></i><span>Channel</span></a>
          <a href="https://t.me/CineFlow_Update" class="nav-link"><i class="fas fa-book"></i><span>Gateway</span></a>
          <a href="https://t.me/CineFlow_Update" class="nav-link"><i class="fas fa-comments"></i><span>Support</span></a>
          <a href="https://github.com/tharindu899" class="nav-link"><i class="fab fa-github"></i><span>GitHub</span></a>
        </div>
      </div>
    </nav>

    <main class="main-hero">
      <div class="hero-content">
        <a href="https://github.com/tharindu899">
          <img src="https://i.ibb.co/Y477373k/IMG-20260817-154226.png" alt="CineFlow Logo" class="hero-logo">
        </a>
        <h1>Unleash Seamless Mirroring.<br><span class="hero-highlight">Zero Limits, Maximum Speed.</span></h1>
        <p class="hero-sub">The Ultimate Telegram Mirror &amp; Leech Bot by <b>CineFlow</b></p>
        <div class="hero-actions">
          <a href="https://t.me/CineFlow_Update" class="btn btn-primary"><i class="fab fa-telegram-plane"></i> Join Channel</a>
          <a href="https://github.com/tharindu899" class="btn btn-secondary"><i class="fab fa-github"></i> View on GitHub</a>
        </div>
      </div>
    </main>

    <footer>
      &copy; <span id="year"></span> CineFlow — Built for speed, made with mirrors.
      <div style="margin-top:0.4rem;">
        <a href="https://t.me/CineFlow_Update"><i class="fab fa-telegram-plane"></i></a>
        <a href="https://github.com/tharindu899"><i class="fab fa-github"></i></a>
      </div>
    </footer>

    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
